<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Acme Outdoor</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header><h1>Acme Outdoor</h1><span id="cart-count">Cart (0)</span></header>
  <main>
    <section id="products" class="grid"></section>
    <aside id="cart">
      <h2>Your cart</h2>
      <ul id="cart-lines"></ul>
      <form id="promo-form">
        <input id="promo" placeholder="Promo code" autocomplete="off" />
        <button type="submit">Apply</button>
      </form>
      <p id="promo-msg"></p>
      <dl>
        <dt>Subtotal</dt><dd id="subtotal">$0.00</dd>
        <dt>Discount</dt><dd id="discount">$0.00</dd>
        <dt>Total</dt><dd id="total">$0.00</dd>
      </dl>
      <button id="place-order" disabled>Place order</button>
      <p id="order-msg"></p>
    </aside>
  </main>
  <script src="/cart.js"></script>
  <script src="/app.js"></script>
</body>
</html>
